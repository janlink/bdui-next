name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Test, typecheck, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Beads CLI
        env:
          BD_VERSION: "1.2.2"
        run: |
          curl -fsSL "https://github.com/gastownhall/beads/releases/download/v${BD_VERSION}/beads_${BD_VERSION}_linux_amd64.tar.gz" -o /tmp/beads.tar.gz
          tar -xzf /tmp/beads.tar.gz -C /tmp bd
          sudo install -m 0755 /tmp/bd /usr/local/bin/bd
          bd --version

      - name: Run quality gates
        run: bun run check
